<!--
  Each frame is an independent collapse event.
  There is no thread between them.
  The pattern is yours.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quantum Radio</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000000;
    color: #ffb000;
    font-family: "Courier New", Courier, monospace;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
    padding: 2rem 1rem 4rem;
  }

  .row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .row-context {
    color: #ffb000;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-align: center;
    opacity: 0.85;
    max-width: 40rem;
  }

  .row-context .n-qubits {
    font-size: 1.2rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 0.25rem;
    opacity: 1;
  }

  .panels {
    display: flex;
    flex-direction: row;
    gap: 3rem;
  }

  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  .panel-label {
    color: #ffb000;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  canvas {
    display: block;
    background: #000000;
    image-rendering: pixelated;
  }

  .canvas-wrap {
    position: relative;
    display: flex;
  }

  .no-data {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #ffb000;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    pointer-events: none;
  }

  .no-data.visible {
    display: flex;
  }

  .readout {
    color: #ffb000;
    font-size: 1rem;
    letter-spacing: 0.15em;
    text-align: center;
  }

  .status {
    color: #ffb000;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    opacity: 0.7;
  }

  .legend {
    display: none;
    color: #ffb000;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    opacity: 0.75;
    text-align: center;
  }

  .legend.visible {
    display: block;
  }

  .pager {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    color: #ffb000;
    font-family: "Courier New", Courier, monospace;
  }

  .pager button {
    background: transparent;
    border: 1px solid #ffb000;
    color: #ffb000;
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
  }

  .pager button:hover:not(:disabled) {
    background: #ffb000;
    color: #000000;
  }

  .pager button:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .pager button:focus-visible {
    outline: 2px solid #ffb000;
    outline-offset: 2px;
  }

  .pager-indicator {
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    opacity: 0.85;
    min-width: 12rem;
    text-align: center;
  }
</style>
</head>
<body>

<script>
(function () {
  "use strict";

  // One row per qubit count -- keep this in sync with whichever
  // quantum_radio_results_<N>q.json files actually exist on disk
  // (quantum_radio.py --qubits N writes one set per N). Capped at 16: even
  // with only the active row's canvas drawing (see the pager below), 18
  // qubits means fillRect-ing up to 262,144 cells per panel at 20fps, which
  // visibly drags. 16 qubits (65,536 cells) is the largest that stays smooth.
  const QUBIT_COUNTS = [2, 10, 12, 14, 16];

  // Canvas resolution is set to EXACTLY (cols, rows) -- one basis state per
  // intrinsic pixel -- then scaled up via CSS (image-rendering: pixelated) so
  // each state reads as a visible chunky block instead of a single screen
  // pixel. See buildRowDom for how CELL_SCALE_TARGET_PX turns into a per-row
  // integer scale.
  const CELL_SCALE_TARGET_PX = 512;
  const PHOSPHOR = [0, 255, 65]; // #00ff41
  // Global rather than per-row: one switch changes how every row paints,
  // read fresh each tick (see populateRow) so flipping it takes effect on the
  // very next frame, no rebuild needed.
  let renderMode = "phosphor"; // "phosphor" | "topo"
  const FPS = 20;
  const TICK_MS = 1000 / FPS;
  // Each tick still draws a fresh independent random target per cell (weighted
  // by that state's measured probability) -- the "independent collapse event"
  // is still real. EASING just keeps what's actually painted from jumping
  // straight to that target: it eases toward it a fraction of the way each
  // frame, so consecutive frames blend instead of hard-cutting. Lower = smoother
  // / laggier, higher = snappier / flickerier; 1.0 would be the original behavior.
  const EASING = 0.25;

  // Factor n (a power of 2) into a (cols, rows) grid as close to square as
  // possible, cols >= rows, so every basis state gets exactly one cell. Not
  // always a perfect square -- odd qubit counts (2**n has only power-of-2
  // factors) land on the nearest power-of-2 rectangle instead, e.g. 2**15 ->
  // 256x128, never a wasted cell either way.
  function gridDimsFor(nStates) {
    let cols = Math.round(Math.sqrt(nStates));
    while (nStates % cols !== 0) cols++;
    return { cols, rows: nStates / cols };
  }

  function arrayMax(arr) {
    // Math.max(...arr) blows the call stack once arr has tens of thousands of
    // elements (it spreads every element as a function argument) -- at 18
    // qubits nStates is 262144, well past that limit. A plain loop has no such
    // bound.
    let max = 0;
    for (let i = 0; i < arr.length; i++) if (arr[i] > max) max = arr[i];
    return max;
  }

  function countsToProbabilities(counts, nStates) {
    const probabilities = new Float64Array(nStates);
    if (!counts) return probabilities;
    let total = 0;
    for (const key in counts) total += counts[key];
    if (total === 0) return probabilities;
    for (const key in counts) {
      const index = parseInt(key, 2);
      probabilities[index] = counts[key] / total;
    }
    return probabilities;
  }

  function drawBlank(ctx) {
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  }

  // Draws one fresh independent random target per basis state, weighted by
  // its own measured probability relative to the panel's brightest state --
  // the "independent collapse event". What's actually stored is eased toward
  // that target (see EASING above) rather than jumping straight to it, so the
  // flicker reads as smooth motion instead of a hard per-frame cut. `current`
  // is the persistent eased-brightness/elevation buffer, owned by the caller
  // and mutated in place across calls -- shared between both paint modes
  // below, since it's the same underlying signal either way, just visualized
  // differently.
  function updateBrightness(probabilities, maxProbability, current, nStates) {
    for (let index = 0; index < nStates; index++) {
      const weight = maxProbability > 0 ? probabilities[index] / maxProbability : 0;
      const target = weight > 0 ? Math.random() * weight : 0;
      current[index] += (target - current[index]) * EASING;
    }
  }

  // Canvas is native resolution (cols x rows), so each cell is exactly one
  // real pixel (scaled up for display via CSS -- see buildRowDom).
  function paintPhosphor(ctx, current, cols, rows) {
    drawBlank(ctx);
    const nStates = cols * rows;
    for (let index = 0; index < nStates; index++) {
      if (current[index] <= 0.002) continue; // skip the pixel below the eye's threshold

      const col = index % cols;
      const row = Math.floor(index / cols);

      const r = Math.round(PHOSPHOR[0] * current[index]);
      const g = Math.round(PHOSPHOR[1] * current[index]);
      const b = Math.round(PHOSPHOR[2] * current[index]);
      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.fillRect(col, row, 1, 1);
    }
    drawScanlines(ctx, rows);
  }

  function drawScanlines(ctx, rows) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
    for (let row = 0; row < rows; row += 2) {
      ctx.fillRect(0, row, ctx.canvas.width, 1);
    }
  }

  // Same hypsometric stops as quantum_radio.py's TOPO_CMAP -- deep blue-black
  // through green, yellow, red, to white -- so the live and static renders
  // agree visually.
  const TOPO_STOPS = [
    [0.00, [1, 4, 12]],
    [0.20, [11, 61, 145]],
    [0.45, [42, 157, 52]],
    [0.65, [233, 199, 22]],
    [0.82, [209, 52, 31]],
    [1.00, [253, 248, 239]],
  ];

  function topoColor(t) {
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    for (let i = 0; i < TOPO_STOPS.length - 1; i++) {
      const [t0, c0] = TOPO_STOPS[i];
      const [t1, c1] = TOPO_STOPS[i + 1];
      if (t <= t1) {
        const f = t1 === t0 ? 0 : (t - t0) / (t1 - t0);
        return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
      }
    }
    return TOPO_STOPS[TOPO_STOPS.length - 1][1];
  }

  // Same light source as quantum_radio.py's LightSource(azdeg=315, altdeg=45).
  const LIGHT_AZ = (315 * Math.PI) / 180;
  const LIGHT_ALT = (45 * Math.PI) / 180;
  const LIGHT_VEC = [Math.cos(LIGHT_ALT) * Math.cos(LIGHT_AZ), Math.cos(LIGHT_ALT) * Math.sin(LIGHT_AZ), Math.sin(LIGHT_ALT)];
  const VERT_EXAG = 3; // matches plot_comparison's hillshade vert_exag
  const HILLSHADE_BLEND = 0.3; // matches plot_comparison's 70/30 color/hillshade blend

  // Linear-interpolation percentile, matching numpy.percentile's default
  // method -- kept identical to quantum_radio.py's np.percentile(counts, [5,
  // 95]) so the live and static color scales agree. `arr` is copied and
  // sorted in place; call this once per row (setup time), never per frame.
  function percentile(arr, p) {
    const sorted = Float64Array.from(arr).sort();
    const idx = (p / 100) * (sorted.length - 1);
    const lo = Math.floor(idx);
    const hi = Math.ceil(idx);
    if (lo === hi) return sorted[lo];
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
  }

  // `current` doubles as an "elevation" grid here -- same eased per-cell
  // signal paintPhosphor reads as brightness, just colormapped and hillshaded
  // instead. No contour lines: that needs marching squares over the live
  // frame, which is real implementation work matplotlib's contour() does for
  // free, and quantum_radio.py already drops contours above 8 qubits anyway
  // since they degenerate to noise once cells aren't spatially correlated.
  // Uses a single ImageData blit instead of one fillRect per cell -- cheaper
  // than paintPhosphor, not more expensive, despite doing more math per cell.
  //
  // p5Norm/p95Norm clip the *color* scale to this panel's 5th-95th percentile
  // hit-count range (see populateRow), same as quantum_radio.py's
  // draw_topographic_panel -- computed once from the static probability data,
  // not from `current` itself, since `current` is a noisy per-frame draw and
  // its own percentiles would jitter frame to frame. Hillshade is unaffected:
  // it still reads raw `current` neighbor differences, same as before.
  function paintTopo(ctx, current, cols, rows, p5Norm, p95Norm) {
    const imageData = ctx.createImageData(cols, rows);
    const data = imageData.data;
    const colorRange = p95Norm - p5Norm || 1e-9;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const index = row * cols + col;
        const left = current[row * cols + Math.max(col - 1, 0)];
        const right = current[row * cols + Math.min(col + 1, cols - 1)];
        const up = current[Math.max(row - 1, 0) * cols + col];
        const down = current[Math.min(row + 1, rows - 1) * cols + col];

        const dzdx = (right - left) * 0.5 * VERT_EXAG;
        const dzdy = (down - up) * 0.5 * VERT_EXAG;

        let nx = -dzdx;
        let ny = -dzdy;
        let nz = 1;
        const nlen = Math.sqrt(nx * nx + ny * ny + nz * nz);
        nx /= nlen;
        ny /= nlen;
        nz /= nlen;
        const shade = Math.max(0, nx * LIGHT_VEC[0] + ny * LIGHT_VEC[1] + nz * LIGHT_VEC[2]);

        const t = (current[index] - p5Norm) / colorRange;
        const [cr, cg, cb] = topoColor(t);
        const shadeRgb = shade * 255;
        const pixelIndex = index * 4;
        data[pixelIndex] = cr * (1 - HILLSHADE_BLEND) + shadeRgb * HILLSHADE_BLEND;
        data[pixelIndex + 1] = cg * (1 - HILLSHADE_BLEND) + shadeRgb * HILLSHADE_BLEND;
        data[pixelIndex + 2] = cb * (1 - HILLSHADE_BLEND) + shadeRgb * HILLSHADE_BLEND;
        data[pixelIndex + 3] = 255;
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }

  // DOM construction only -- no data yet, so this runs synchronously for every
  // qubit count up front. That keeps row order matching QUBIT_COUNTS order
  // regardless of which row's fetch resolves first (see populateRow).
  function buildRowDom(nQubits) {
    const row = document.createElement("div");
    row.className = "row";

    const context = document.createElement("div");
    context.className = "row-context";
    context.innerHTML = `<span class="n-qubits">${nQubits} qubits</span>loading...`;
    row.appendChild(context);

    const panels = document.createElement("div");
    panels.className = "panels";

    const hardwarePanel = document.createElement("div");
    hardwarePanel.className = "panel";
    hardwarePanel.innerHTML =
      `<div class="panel-label">Hardware</div>` +
      `<div class="canvas-wrap"><canvas></canvas><div class="no-data">NO DATA</div></div>` +
      `<div class="legend"></div>`;
    const hardwareCanvas = hardwarePanel.querySelector("canvas");
    const hardwareNoData = hardwarePanel.querySelector(".no-data");
    const hardwareLegend = hardwarePanel.querySelector(".legend");

    const simPanel = document.createElement("div");
    simPanel.className = "panel";
    simPanel.innerHTML =
      `<div class="panel-label">Simulation</div><div class="canvas-wrap"><canvas></canvas></div>` +
      `<div class="legend"></div>`;
    const simCanvas = simPanel.querySelector("canvas");
    const simLegend = simPanel.querySelector(".legend");

    panels.appendChild(hardwarePanel);
    panels.appendChild(simPanel);
    row.appendChild(panels);

    const readout = document.createElement("div");
    readout.className = "readout";
    readout.textContent = "TVD: --";
    row.appendChild(readout);

    const status = document.createElement("div");
    status.className = "status";
    status.textContent = "SHOT 0000 / 0000";
    row.appendChild(status);

    const nStates = 1 << nQubits;
    const { cols, rows } = gridDimsFor(nStates);
    // Canvas resolution (canvas.width/height) stays exactly (cols, rows) -- one
    // intrinsic pixel per basis state, unchanged from how drawFrame addresses
    // cells. Display size is scaled up separately via CSS with
    // image-rendering: pixelated (see stylesheet), so each cell renders as a
    // sharp-edged block rather than a single screen pixel. CELL_SCALE_TARGET_PX
    // picks the scale per row so every panel lands near the same displayed
    // size regardless of qubit count -- 2 qubits gets a few huge blocks, 16
    // qubits gets many small-but-still-chunky ones -- clamped so neither a
    // tiny register (huge per-cell scale) nor a large one (scale floors at 1)
    // goes to an extreme.
    const scale = Math.max(2, Math.min(32, Math.round(CELL_SCALE_TARGET_PX / Math.max(cols, rows))));
    for (const canvas of [hardwareCanvas, simCanvas]) {
      canvas.width = cols;
      canvas.height = rows;
      canvas.style.width = `${cols * scale}px`;
      canvas.style.height = `${rows * scale}px`;
    }

    return { row, hardwareCanvas, simCanvas, hardwareNoData, hardwareLegend, simLegend, context, readout, status, nStates, cols, rows };
  }

  // Fetches this row's data and wires up drawing state. Only ever touches its
  // own row's DOM/canvases -- never starts a render loop itself. Returns a
  // tick function (or null on failure) that the pager calls only while this
  // row is the one on screen.
  async function populateRow(nQubits, dom) {
    const { hardwareCanvas, simCanvas, hardwareNoData, hardwareLegend, simLegend, context, readout, status, nStates, cols, rows } = dom;
    const hardwareCtx = hardwareCanvas.getContext("2d");
    const simCtx = simCanvas.getContext("2d");

    let data;
    try {
      const response = await fetch(`quantum_radio_results_${nQubits}q.json`);
      data = await response.json();
    } catch (err) {
      context.innerHTML = `<span class="n-qubits">${nQubits} qubits</span>could not load quantum_radio_results_${nQubits}q.json -- run quantum_radio.py --qubits ${nQubits} first`;
      drawBlank(hardwareCtx);
      drawBlank(simCtx);
      hardwareNoData.classList.add("visible");
      return null;
    }

    const shots = data.shots || 8192;
    const hasHardware = !!data.hardware_counts;
    hardwareNoData.classList.toggle("visible", !hasHardware);
    const shotsPerState = (shots / nStates).toFixed(shots / nStates < 10 ? 1 : 0);

    context.innerHTML =
      `<span class="n-qubits">${nQubits} qubits</span>` +
      `${nStates.toLocaleString()} states &middot; ${cols}&times;${rows} grid &middot; ` +
      `${shots.toLocaleString()} shots (~${shotsPerState}/state)`;

    const simProbabilities = countsToProbabilities(data.simulator_counts, nStates);
    const hardwareProbabilities = countsToProbabilities(data.hardware_counts, nStates);
    const simMax = arrayMax(simProbabilities);
    const hardwareMax = arrayMax(hardwareProbabilities);

    // Topo mode's color scale: 5th-95th percentile of hit counts, computed
    // once here from the static probability data (never from `current` --
    // see paintTopo) and independently per panel, same as
    // quantum_radio.py's draw_topographic_panel. Expressed as a fraction of
    // that panel's own max, since that's the scale `current` lives on.
    const simP5 = percentile(simProbabilities, 5);
    const simP95 = percentile(simProbabilities, 95);
    const simP5Norm = simMax > 0 ? simP5 / simMax : 0;
    const simP95Norm = simMax > 0 ? simP95 / simMax : 1;
    simLegend.textContent = `5TH-95TH PCT: ${Math.round(simP5 * shots)}-${Math.round(simP95 * shots)} HITS`;

    let hardwareP5Norm = 0;
    let hardwareP95Norm = 1;
    if (hasHardware) {
      const hardwareP5 = percentile(hardwareProbabilities, 5);
      const hardwareP95 = percentile(hardwareProbabilities, 95);
      hardwareP5Norm = hardwareMax > 0 ? hardwareP5 / hardwareMax : 0;
      hardwareP95Norm = hardwareMax > 0 ? hardwareP95 / hardwareMax : 1;
      hardwareLegend.textContent = `5TH-95TH PCT: ${Math.round(hardwareP5 * shots)}-${Math.round(hardwareP95 * shots)} HITS`;
    }

    readout.textContent =
      typeof data.total_variation_distance === "number"
        ? `TVD: ${data.total_variation_distance.toFixed(4)}`
        : "TVD: -- (no hardware run)";

    let shot = 0;
    const hardwareBrightness = new Float32Array(nStates);
    const simBrightness = new Float32Array(nStates);

    if (!hasHardware) drawBlank(hardwareCtx); // static -- the "NO DATA" HTML overlay does the rest

    return function tick() {
      const paint = renderMode === "topo" ? paintTopo : paintPhosphor;
      if (hasHardware) {
        updateBrightness(hardwareProbabilities, hardwareMax, hardwareBrightness, nStates);
        paint(hardwareCtx, hardwareBrightness, cols, rows, hardwareP5Norm, hardwareP95Norm);
      }
      updateBrightness(simProbabilities, simMax, simBrightness, nStates);
      paint(simCtx, simBrightness, cols, rows, simP5Norm, simP95Norm);

      shot = (shot + 1) % (shots + 1);
      status.textContent = `SHOT ${String(shot).padStart(4, "0")} / ${shots}`;
    };
  }

  // Rendering all rows at once meant redrawing every basis state of every
  // qubit count 20x/second simultaneously -- at 18 qubits alone that's
  // 262,144 cells per panel, per frame. The pager only ever runs the tick
  // function for the row currently on screen, so frame cost stays flat
  // regardless of how many qubit counts are in QUBIT_COUNTS.
  function buildPager(nQubits, onNav) {
    const pager = document.createElement("div");
    pager.className = "pager";

    const prev = document.createElement("button");
    prev.textContent = "‹ PREV";
    prev.addEventListener("click", () => onNav(-1));

    const indicator = document.createElement("div");
    indicator.className = "pager-indicator";

    const next = document.createElement("button");
    next.textContent = "NEXT ›";
    next.addEventListener("click", () => onNav(1));

    pager.appendChild(prev);
    pager.appendChild(indicator);
    pager.appendChild(next);
    document.body.appendChild(pager);

    return {
      el: pager,
      setState(index, total) {
        indicator.textContent = `${index + 1} / ${total} · ${nQubits[index]} QUBITS`;
        prev.disabled = index === 0;
        next.disabled = index === total - 1;
      },
    };
  }

  // Flips the global renderMode (see top of file) between the green-phosphor
  // CRT look and the live topographic render (paintTopo). Both read the same
  // eased per-cell signal (see updateBrightness) -- this only changes how
  // that signal is painted, not the "independent collapse event" underneath
  // it, and takes effect on the very next tick with no rebuild.
  function buildModeToggle() {
    const button = document.createElement("button");
    button.textContent = "MODE: PHOSPHOR";
    button.addEventListener("click", () => {
      renderMode = renderMode === "phosphor" ? "topo" : "phosphor";
      button.textContent = renderMode === "topo" ? "MODE: TOPO" : "MODE: PHOSPHOR";
      // Legend bars only mean anything against the topo color scale -- every
      // row's legend exists in the DOM regardless of which page is showing,
      // so toggle them all rather than just the current page's.
      document.querySelectorAll(".legend").forEach((el) => el.classList.toggle("visible", renderMode === "topo"));
    });
    return button;
  }

  async function main() {
    const doms = QUBIT_COUNTS.map(buildRowDom);
    for (const dom of doms) document.body.appendChild(dom.row);

    let current = 0;
    const showOnly = (index) => {
      doms.forEach((dom, i) => { dom.row.style.display = i === index ? "" : "none"; });
    };
    showOnly(current);

    const pager = buildPager(QUBIT_COUNTS, (delta) => {
      const next = current + delta;
      if (next < 0 || next >= QUBIT_COUNTS.length) return;
      current = next;
      showOnly(current);
      pager.setState(current, QUBIT_COUNTS.length);
    });
    pager.setState(current, QUBIT_COUNTS.length);

    const modeToggle = buildModeToggle();
    pager.el.appendChild(modeToggle);

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") pager.el.querySelector("button").click();
      if (e.key === "ArrowRight") pager.el.querySelectorAll("button")[1].click();
      if (e.key === "m" || e.key === "M") modeToggle.click();
    });

    // allSettled rather than all: one row throwing (bad/missing data, a
    // rendering bug at some future qubit count) must not stop the rest from
    // loading.
    const results = await Promise.allSettled(QUBIT_COUNTS.map((n, i) => populateRow(n, doms[i])));
    const ticks = results.map((result) => (result.status === "fulfilled" ? result.value : null));
    results.forEach((result, i) => {
      if (result.status === "rejected") console.error(`quantum_radio row ${QUBIT_COUNTS[i]}q setup failed:`, result.reason);
    });

    setInterval(() => {
      const tick = ticks[current];
      if (tick) tick();
    }, TICK_MS);
  }

  main();
})();
</script>

</body>
</html>
